# nginx proxy address - http://172.17.0.1:32400

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plex
    ports:
      - "32400:32400"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/plex:/config
      - ./volumes/data/plex:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  plex:
    external: false
