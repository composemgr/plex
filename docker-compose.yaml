# nginx proxy address - http://172.17.0.1:32400

name: plex
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  plex:
    image: plexinc/pms-docker:latest
    pull_policy: always
    container_name: plex-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - plex
    ports:
      - "172.17.0.1:32400:32400"
    environment:
      TZ: ${TZ:-America/New_York}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://${BASE_HOST_NAME:-localhost}:32400/
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/plex:/config
      - ./volumes/data/plex/media:/data
      - ./volumes/data/plex/transcode:/transcode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  plex:
    name: plex
    external: false
