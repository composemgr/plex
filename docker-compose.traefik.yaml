name: plex
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  plex:
    image: plexinc/pms-docker:latest
    pull_policy: always
    container_name: plex-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    ports:
      - '32469:32469'
      - '8324:8324'
      - '1900:1900/udp'
      - '32410-32414:32410-32414/udp'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.plex.entrypoints=http'
      - 'traefik.http.routers.plex.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.plex.middlewares=plex-https-redirect'
      - 'traefik.http.middlewares.plex-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.plex-secure.entrypoints=https'
      - 'traefik.http.routers.plex-secure.tls=true'
      - 'traefik.http.routers.plex-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.plex-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.plex-secure.service=plex'
      - 'traefik.http.services.plex.loadbalancer.server.port=32400'
    networks:
      - plex
      - traefik
    environment:
      TZ: ${TZ:-America/New_York}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://${BASE_HOST_NAME:-localhost}:32400/
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      CONTAINER_NAME: plex-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/config/plex:/config
      - ./volumes/data/plex/media:/data
      - ./volumes/data/plex/transcode:/transcode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  plex:
    name: plex
    external: false
  traefik:
    external: true
